<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Course</title>
</head>
<body>

<h1>Edit Course</h1>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <input type="text"
           name="title"
           value="{{ course.title }}">

    <textarea name="description">

{{ course.description }}

    </textarea>

    <input type="file" name="image">

    <button type="submit">

        Update Course

    </button>

</form>

</body>
</html>
