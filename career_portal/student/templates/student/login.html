<!DOCTYPE html>
<html lang="en">

{% load static %}

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">


</head>

<body>

<!-- LOGIN CONTAINER -->

<div class="login-container">

    <!-- LEFT SIDE -->

    <div class="login-left">

        <h1>

            Welcome Back

        </h1>

        <p>

            Login to continue your career journey
            and explore your future opportunities.

        </p>

        <img src="{% static 'img/login.jpg' %}" alt="Login">

    </div>

    <!-- RIGHT SIDE -->

    <div class="login-right">

        <form method="POST" class="login-form">

            {% csrf_token %}

            <h2>

                Student Login

            </h2>

            <input type="email"
                   name="email"
                   placeholder="Enter Your Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">

                Login

            </button>

            <p class="register-link">

                Don't have an account?

                <a href="/register/">

                    Register Here

                </a>

            </p>

        </form>

    </div>

</div>

</body>

</html>
